name: XAUUSD Signal Check

on:
  schedule:
    # Every 15 min, every day of the week - including Saturday now.
    #
    # This used to skip Saturday entirely ("0-5" = Sun-Fri) since spot
    # gold is always closed that day and there was nothing else for a run
    # to do. That's no longer true: bot.py now also checks for gold-
    # relevant news every cycle (Fed decisions, geopolitical shocks, etc),
    # independent of market hours - and news doesn't take Saturday off.
    # bot.py's own market_is_open() check still gates the TRADING side
    # precisely (DST-aware, via zoneinfo); this cron change just means
    # Saturday's runs now do news-checking work instead of doing nothing.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python bot.py

      - name: Save state back to repo
        run: |
          git config user.name "xauusd-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if [ -f near_misses.log ]; then
            git add near_misses.log
          fi
          git diff --staged --quiet || git commit -m "Update signal state [skip ci]"
          git push
